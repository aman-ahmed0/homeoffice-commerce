apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homeoffice-hub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aman-ahmed0/homeoffice-commerce.git
    targetRevision: develop
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true