backend:
  replicas: 1

  image:
    repository: proj-backend
    tag: health-v1
    pullPolicy: Never

  service:
    port: 5000
    targetPort: 5000

  config:
    DB_HOST: "db"
    DB_PORT: "5432"
    FLASK_ENV: "development"

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"